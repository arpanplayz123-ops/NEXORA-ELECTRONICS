<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA ELECTRONICS | Premium Tech Store</title>
    <style>
        /* CSS Variables */
        :root {
            --bg-main: #0a0c10;
            --bg-secondary: #12151c;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-glass: rgba(18, 21, 28, 0.7);
            
            --accent-primary: #007bff;
            --accent-glow: #00d2ff;
            --accent-gradient: linear-gradient(135deg, #007bff 0%, #00d2ff 100%);
            
            --text-primary: #ffffff;
            --text-secondary: #a0aab2;
            --text-dark: #0a0c10;
            
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 255, 255, 0.2);
            
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            
            --transition: all 0.3s ease;
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            width: 100%;
        }

        body.modal-open {
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        /* Typography */
        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            line-height: 1.2;
        }

        .section-title {
            text-align: center;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            margin-bottom: 1rem;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        /* Layout Utility */
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.25rem;
        }

        section {
            padding: 4rem 0;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            outline: none;
            text-align: center;
            min-height: 44px; /* Touch target */
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: var(--text-primary);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .btn-primary:hover {
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.5);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--border-hover);
        }

        .btn-outline:hover {
            background: var(--border-glass);
            border-color: var(--accent-primary);
        }

        .btn-whatsapp {
            background: #25D366;
            color: #fff;
        }
        
        .btn-whatsapp:hover {
            background: #128C7E;
        }

        .btn-block {
            width: 100%;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-glass);
            padding: 1rem 0;
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-primary);
            z-index: 101;
        }

        .logo span {
            color: var(--accent-primary);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--accent-primary);
        }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            cursor: pointer;
            z-index: 101;
            background: transparent;
            border: none;
            padding: 0.5rem;
        }

        .hamburger span {
            display: block;
            width: 25px;
            height: 2px;
            background-color: var(--text-primary);
            margin: 5px 0;
            transition: var(--transition);
        }

        /* Hero Section */
        .hero {
            padding: 8rem 0 5rem;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            background: radial-gradient(circle at center, rgba(0, 123, 255, 0.15) 0%, transparent 60%);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            margin-bottom: 1rem;
            background: linear-gradient(to right, #fff, #a0aab2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: clamp(1rem, 3vw, 1.25rem);
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-btns {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* Shop Section (Search & Categories) */
        .shop-controls {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .search-bar {
            width: 100%;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 1rem 1.5rem;
            border-radius: var(--radius-lg);
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .search-bar input:focus {
            border-color: var(--accent-primary);
            background: rgba(255,255,255,0.05);
        }

        .categories {
            display: flex;
            gap: 0.8rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .categories::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            white-space: nowrap;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.9rem;
        }

        .category-btn.active, .category-btn:hover {
            background: var(--accent-primary);
            color: var(--text-primary);
            border-color: var(--accent-primary);
        }

        /* Products Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .product-card:hover {
            transform: translateY(-5px);
            border-color: var(--border-hover);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .product-img-wrap {
            position: relative;
            padding-top: 100%; /* 1:1 Aspect Ratio */
            background: #fff;
            overflow: hidden;
        }

        .product-img-wrap img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 1.5rem;
            transition: transform 0.5s ease;
        }

        .product-card:hover .product-img-wrap img {
            transform: scale(1.05);
        }

        .discount-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #ff4757;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 2;
        }

        .product-info {
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .product-brand {
            font-size: 0.8rem;
            color: var(--accent-primary);
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 0.2rem;
        }

        .product-title {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            flex-grow: 1;
        }

        .product-rating {
            color: #ffa502;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .product-price-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1.25rem;
        }

        .product-price {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .product-old-price {
            text-decoration: line-through;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
        }

        .product-actions .btn {
            flex: 1;
            padding: 0.6rem 0.5rem;
            font-size: 0.85rem;
        }

        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
        }

        /* Offers Section */
        .offers-section {
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.1) 0%, rgba(0, 210, 255, 0.05) 100%);
            border-top: 1px solid var(--border-glass);
            border-bottom: 1px solid var(--border-glass);
            text-align: center;
            padding: 5rem 0;
        }

        .offers-section h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 1rem;
            color: #fff;
        }

        .offers-section p {
            font-size: 1.2rem;
            color: var(--accent-glow);
            margin-bottom: 2rem;
        }

        /* Features (Why Choose Us) */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .feature-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 2rem 1.5rem;
            border-radius: var(--radius-md);
            text-align: center;
            transition: var(--transition);
        }
        
        .feature-card:hover {
            border-color: var(--accent-primary);
            background: rgba(255,255,255,0.05);
        }

        .feature-icon {
            font-size: 2rem;
            color: var(--accent-primary);
            margin-bottom: 1rem;
        }

        .feature-card h3 {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }

        /* About Section */
        .about-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .stat-box {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 1.5rem;
            border-radius: var(--radius-sm);
            text-align: center;
            flex: 1;
            min-width: 140px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-primary);
        }

        .stat-text {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Reviews */
        .reviews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .review-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 1.5rem;
            border-radius: var(--radius-md);
        }

        .review-stars {
            color: #ffa502;
            margin-bottom: 1rem;
        }

        .review-text {
            font-style: italic;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }

        .review-author {
            font-weight: 600;
            color: #fff;
        }

        /* Contact Section */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
        }

        .contact-info-card {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
            margin-bottom: 1rem;
        }

        .contact-info-card h3 {
            margin-bottom: 0.5rem;
            color: var(--accent-primary);
        }

        .contact-info-card p {
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }

        .contact-form {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-glass);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-sm);
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus {
            border-color: var(--accent-primary);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .form-message {
            display: none;
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-top: 1rem;
            background: rgba(37, 211, 102, 0.1);
            border: 1px solid #25D366;
            color: #25D366;
            text-align: center;
        }

        /* Footer */
        footer {
            background: var(--bg-secondary);
            padding: 3rem 0 1.5rem;
            border-top: 1px solid var(--border-glass);
        }

        .footer-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .footer-col h3 {
            margin-bottom: 1rem;
            color: #fff;
        }

        .footer-links li {
            margin-bottom: 0.5rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .footer-links a:hover {
            color: var(--accent-primary);
        }

        .footer-bottom {
            text-align: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-glass);
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .modal-close:hover {
            background: #ff4757;
        }

        .modal-body {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 2rem;
            padding: 2rem;
        }

        .modal-image-container {
            background: #fff;
            border-radius: var(--radius-md);
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-image-container img {
            max-height: 300px;
            object-fit: contain;
        }

        .modal-info h2 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }

        .modal-brand {
            color: var(--accent-primary);
            font-weight: 600;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .modal-price-wrap {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid
